name: Refresh orbits and publish

# Once a day: fetch the public orbit catalogue from CelesTrak, rebuild index.html, commit it,
# and publish the site with GitHub Pages. The sky and land data change rarely and are rebuilt by hand.
on:
  schedule:
    - cron: '17 5 * * *'
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Fetch the orbit catalogue and SATCAT (Space-Track, falling back to CelesTrak)
        if: github.event_name != 'push'
        env:
          SPACETRACK_USER: ${{ secrets.SPACETRACK_USER }}
          SPACETRACK_PASS: ${{ secrets.SPACETRACK_PASS }}
        run: |
          set -uo pipefail
          # Space-Track.org (the official source) answers with the whole catalogue in one
          # authenticated request; CelesTrak's public endpoint needs one request per launch
          # year (~68/day) and is what got silently blocked before. tools/fetch_catalog.py
          # tries Space-Track first and only falls back to CelesTrak if that isn't set up
          # or fails, stopping immediately on any bad response either way per each site's
          # usage policy, rather than hammering through errors.
          if python tools/fetch_catalog.py --tle-out /tmp/catalog.tle --satcat-out /tmp/satcat.csv; then
            python tools/build_orbits.py --tle /tmp/catalog.tle --satcat /tmp/satcat.csv
          else
            # Fail the run loudly instead of silently keeping stale orbit data: a red X (and, if notifications
            # are on, an email) is what surfaces this instead of the site quietly going stale for weeks.
            echo "::error::Could not refresh the orbit catalogue today from either source. Leaving the previous data in place and failing this run so it doesn't go unnoticed."
            exit 1
          fi

      # On a push, whoever pushed already committed a matching, locally-built index.html (the
      # build isn't reproducible byte-for-byte across machines/Python versions, even with gzip's
      # mtime pinned, so rebuilding here would just manufacture a diff and re-commit a no-op change
      # every single push -- which is what kept jamming up pushes with "fetch first" conflicts).
      # Only rebuild+commit when this run actually fetched new data itself.
      - name: Build the page
        if: github.event_name != 'push'
        run: python tools/build.py

      - name: Commit refreshed data
        if: github.event_name != 'push'
        run: |
          git config user.name "shared-sky-bot"
          git config user.email "shared-sky-bot@users.noreply.github.com"
          git add data/orbits.json.gz index.html
          git diff --cached --quiet || git commit -m "Refresh orbits $(date -u +%Y-%m-%d)" && git push

      - uses: actions/configure-pages@v5
      - name: Stage the site
        run: mkdir -p _site && cp index.html _site/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
